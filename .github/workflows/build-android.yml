name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "capacitor.config.ts"
      - ".github/workflows/build-android.yml"
      - ".github/android-debug.keystore.b64"
      - "scripts/**"

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_GOOGLE_WEB_CLIENT_ID: ${{ secrets.VITE_GOOGLE_WEB_CLIENT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Check Supabase build configuration
        run: |
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_ANON_KEY"
          test -n "$VITE_GOOGLE_WEB_CLIENT_ID"

      - name: Build web app
        run: npm run build

      - name: Verify Supabase URL is embedded
        run: |
          grep -R -F "$VITE_SUPABASE_URL" dist/assets --include='*.js' >/dev/null
          echo "Supabase URL is embedded in the production bundle."

      - name: Verify Supabase key is embedded without printing it
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          key = os.environ["VITE_SUPABASE_ANON_KEY"]
          found = False
          for path in Path("dist/assets").rglob("*.js"):
              try:
                  text = path.read_text(encoding="utf-8", errors="ignore")
              except Exception:
                  continue
              if key in text:
                  found = True
                  break
          if not found:
              raise SystemExit("Supabase API key was not found in the production bundle.")
          print("Supabase API key is embedded in the production bundle (value hidden).")
          PY

      - name: Create Android project
        run: npx cap add android

      - name: Configure Android OAuth callback
        run: node scripts/patch-android-oauth-callback.mjs

      - name: Sync web app into Android
        run: npx cap sync android

      - name: Configure fixed debug signing key
        working-directory: android
        run: |
          mkdir -p "$HOME/.android"
          python3 - <<'PY'
          import base64
          from pathlib import Path

          source = Path("../.github/android-debug.keystore.b64").read_text(encoding="utf-8").strip()
          data = base64.b64decode(source, validate=True)

          target = Path.home() / ".android" / "debug.keystore"
          target.write_bytes(data)
          target.chmod(0o600)

          print("Fixed Android debug keystore restored successfully.")
          PY
      - name: Verify native Google Sign-In configuration
        working-directory: android
        run: |
          echo "=== Google Sign-In Android signing fingerprints ==="
          ./gradlew signingReport

          echo "=== Verify expected debug SHA-1 ==="
          ACTUAL_SHA1="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android | awk -F': ' '/SHA1:/{print $2; exit}')"
          EXPECTED_SHA1="51:09:69:A8:E1:1C:F4:04:6C:86:2C:10:04:37:4C:1E:75:B5:F5:A9"
          test "$ACTUAL_SHA1" = "$EXPECTED_SHA1"

          echo "=== Social Login browser dependency ==="
          grep -n -A3 -B2 "androidbrowserhelper:2.5.0" \
            ../node_modules/@capgo/capacitor-social-login/android/build.gradle || true

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gia-Pha-Dong-Ho-Viet-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
