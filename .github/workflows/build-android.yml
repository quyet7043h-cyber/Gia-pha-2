name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "capacitor.config.ts"
      - ".github/workflows/build-android.yml"

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_GOOGLE_WEB_CLIENT_ID: ${{ secrets.VITE_GOOGLE_WEB_CLIENT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Check Supabase build configuration
        run: |
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_ANON_KEY"
          test -n "$VITE_GOOGLE_WEB_CLIENT_ID"

      - name: Build web app
        run: npm run build

      - name: Verify Supabase URL is embedded
        run: |
          grep -R -F "$VITE_SUPABASE_URL" dist/assets --include='*.js' >/dev/null
          echo "Supabase URL is embedded in the production bundle."

      - name: Verify Supabase key is embedded without printing it
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          key = os.environ["VITE_SUPABASE_ANON_KEY"]
          found = False
          for path in Path("dist/assets").rglob("*.js"):
              try:
                  text = path.read_text(encoding="utf-8", errors="ignore")
              except Exception:
                  continue
              if key in text:
                  found = True
                  break
          if not found:
              raise SystemExit("Supabase API key was not found in the production bundle.")
          print("Supabase API key is embedded in the production bundle (value hidden).")
          PY

      - name: Create Android project
        run: npx cap add android

      - name: Configure Android native Google Sign-In
        run: node scripts/patch-android-social-login.mjs

      - name: Sync web app into Android
        run: npx cap sync android

      - name: Verify native Google Sign-In configuration
        working-directory: android
        run: |
          echo "=== Create debug keystore if missing ==="
          mkdir -p "$HOME/.config/.android"
          if [ ! -f "$HOME/.config/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.config/.android/debug.keystore" \
              -storepass android \
              -alias AndroidDebugKey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          echo "=== Google Sign-In Android signing fingerprints ==="
          ./gradlew signingReport

          echo "=== Social Login browser dependency ==="
          grep -n -A3 -B2 "androidbrowserhelper:2.5.0" \
            ../node_modules/@capgo/capacitor-social-login/android/build.gradle || true

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gia-Pha-Dong-Ho-Viet-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
